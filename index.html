<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IRL Team • Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* Базовые переменные Telegram */
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f1f2f6);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --link-color: var(--tg-theme-link-color, #007aff);
            --button-color: var(--tg-theme-button-color, #007aff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);

            /* Кастомная палитра */
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            --success: #34c759;
            --success-bg: rgba(52, 199, 89, 0.15);
            --warning: #ff9f0a;
            --warning-bg: rgba(255, 159, 10, 0.15);
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        /* Сброс и база */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom, 20px);
            font-smoothing: antialiased;
            -webkit-font-smoothing: antialiased;
        }

        /* Утилиты анимации */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* Header */
        .header {
            background-color: var(--bg-color);
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
            background-color: rgba(var(--tg-theme-bg-color-rgb), 0.85); /* Fallback нужен, но оставим так */
        }
        /* Фикс прозрачности для заголовка, если theme var не в rgb */
        @supports (backdrop-filter: blur(10px)) {
            .header { background: var(--bg-color); } 
        }

        .avatar-wrap {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--secondary-bg-color);
            position: relative; overflow: hidden;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
        }
        .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-fallback {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            background: var(--accent-gradient); color: white;
        }
        .user-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .user-name { font-size: 17px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role { font-size: 13px; color: var(--hint-color); margin-top: 2px; font-weight: 500; }

        /* Main Stats Card */
        .stats-wrapper { padding: 16px; }
        .main-card {
            background: var(--accent-gradient);
            border-radius: var(--radius-lg);
            padding: 24px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
        }
        /* Декоративные элементы фона */
        .main-card::before {
            content: ''; position: absolute; top: -50px; right: -50px;
            width: 150px; height: 150px; background: rgba(255,255,255,0.15);
            border-radius: 50%; filter: blur(40px);
        }
        .main-card::after {
            content: ''; position: absolute; bottom: -30px; left: -30px;
            width: 120px; height: 120px; background: rgba(0,0,0,0.1);
            border-radius: 50%; filter: blur(30px);
        }

        .card-content { position: relative; z-index: 2; }
        .total-label { font-size: 14px; opacity: 0.9; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .total-amount { font-size: 38px; font-weight: 800; margin: 8px 0 24px; letter-spacing: -0.5px; line-height: 1; }
        
        .mini-stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-md);
            padding: 12px;
            backdrop-filter: blur(5px);
        }
        .mini-stat { text-align: center; }
        .mini-stat-val { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
        .mini-stat-lbl { font-size: 11px; opacity: 0.8; }
        .divider { width: 1px; background: rgba(255,255,255,0.2); margin: 4px 0; }

        /* Quick Chips */
        .chips-scroll {
            display: flex; gap: 12px; padding: 0 16px 20px;
            overflow-x: auto; scrollbar-width: none;
        }
        .chips-scroll::-webkit-scrollbar { display: none; }
        .chip {
            background: var(--bg-color);
            min-width: 130px;
            padding: 14px;
            border-radius: var(--radius-md);
            box-shadow: var(--card-shadow);
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        .chip:active { transform: scale(0.98); }
        .chip-icon {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px; color: white;
        }
        .chip-val { font-size: 17px; font-weight: 700; color: var(--text-color); }
        .chip-lbl { font-size: 12px; color: var(--hint-color); margin-top: 2px; }

        /* Transaction List */
        .section-title {
            padding: 0 20px 12px;
            font-size: 19px; font-weight: 700;
            color: var(--text-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .section-count { font-size: 14px; color: var(--hint-color); font-weight: 500; background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 10px; }

        .list-container {
            background: var(--bg-color);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: 8px 16px 40px;
            min-height: 200px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.02);
        }
        
        .tx-item {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid var(--secondary-bg-color);
            cursor: pointer;
        }
        .tx-item:last-child { border-bottom: none; }
        .tx-icon {
            width: 48px; height: 48px; border-radius: 14px;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            background: var(--secondary-bg-color); color: var(--hint-color);
            transition: transform 0.2s;
        }
        .tx-item:active .tx-icon { transform: scale(0.92); }
        .tx-icon.paid { background: var(--success-bg); color: var(--success); }
        .tx-icon.hold { background: var(--warning-bg); color: var(--warning); }
        
        .tx-body { flex: 1; min-width: 0; }
        .tx-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tx-date { font-size: 13px; color: var(--hint-color); display: flex; align-items: center; gap: 4px; }
        
        .tx-right { text-align: right; flex-shrink: 0; }
        .tx-amount { font-size: 16px; font-weight: 700; color: var(--success); letter-spacing: -0.3px; }
        .tx-status { font-size: 11px; font-weight: 600; margin-top: 4px; }
        .tx-status.paid { color: var(--success); }
        .tx-status.hold { color: var(--warning); }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
        
        .modal {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: var(--bg-color);
            border-radius: 24px 24px 0 0;
            padding: 24px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 85vh; overflow-y: auto;
        }
        .modal-overlay.active .modal { transform: translateY(0); }
        
        .modal-drag { width: 40px; height: 5px; background: var(--secondary-bg-color); border-radius: 100px; margin: -10px auto 20px; }
        
        .modal-header { text-align: center; margin-bottom: 24px; }
        .modal-big-amount { font-size: 42px; font-weight: 800; color: var(--text-color); letter-spacing: -1px; }
        .modal-big-label { font-size: 14px; color: var(--hint-color); font-weight: 500; }
        
        .detail-group {
            background: var(--secondary-bg-color);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .detail-row:last-child { border-bottom: none; }
        .d-label { font-size: 15px; color: var(--hint-color); display: flex; align-items: center; gap: 8px; }
        .d-value { font-size: 15px; font-weight: 600; color: var(--text-color); text-align: right; }
        
        .btn-close {
            margin-top: 24px; width: 100%; padding: 16px;
            background: var(--secondary-bg-color);
            color: var(--text-color);
            border: none; border-radius: var(--radius-md);
            font-size: 16px; font-weight: 600;
            cursor: pointer;
        }

        /* Loading & Empty States */
        .loader-container {
            position: fixed; inset: 0; background: var(--bg-color);
            z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.3s;
        }
        .loader-container.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px; height: 40px; border-radius: 50%;
            border: 3px solid var(--secondary-bg-color);
            border-top-color: #6366f1;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { width: 80px; height: 80px; background: var(--secondary-bg-color); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; color: var(--hint-color); }

        /* SVG fixes */
        svg { width: 100%; height: 100%; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

    <div class="loader-container" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="header">
        <div class="avatar-wrap" id="headerAvatar"></div>
        <div class="user-info">
            <div class="user-name" id="headerName">Загрузка...</div>
            <div class="user-role" id="headerRole">Участник команды</div>
        </div>
    </div>

    <div class="stats-wrapper animate-in" id="statsContainer">
        <div class="main-card">
            <div class="card-content">
                <div class="total-label">
                    <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                    Общий заработок
                </div>
                <div class="total-amount" id="totalAmount">0 ₽</div>
                <div class="mini-stats-grid">
                    <div class="mini-stat">
                        <div class="mini-stat-val" id="countPaid">0</div>
                        <div class="mini-stat-lbl">Выплачено</div>
                    </div>
                    <div class="divider"></div>
                    <div class="mini-stat">
                        <div class="mini-stat-val" id="countHold">0</div>
                        <div class="mini-stat-lbl">Холд</div>
                    </div>
                    <div class="divider"></div>
                    <div class="mini-stat">
                        <div class="mini-stat-val" id="sumHold">0 ₽</div>
                        <div class="mini-stat-lbl">Ожидание</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="chips-scroll animate-in delay-1" id="quickStats"></div>

    <div class="section-title animate-in delay-2">
        <span>История</span>
        <span class="section-count" id="txCount">0</span>
    </div>
    <div class="list-container animate-in delay-3" id="content"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-drag"></div>
            <div class="modal-header">
                <div class="modal-big-label">Чистая прибыль</div>
                <div class="modal-big-amount" id="mAmount"></div>
            </div>
            <div class="detail-group" id="modalBody"></div>
            <button class="btn-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

<script>
    // --- ICONS & CONFIG ---
    const ICONS = {
        arrowUp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`,
        wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>`,
        check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
        clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
        calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>`,
        tag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
        chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
        diamond: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l4 6-10 13L2 9z"/></svg>`,
        hash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>`
    };

    const SUPABASE_URL = 'https://aoyctqguudkdwgixlmvr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFveWN0cWd1dWRrZHdnaXhsbXZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMjU0MDIsImV4cCI6MjA4MTkwMTQwMn0.AOpN7RldZ29C9fP41eMmAb66Jy9bnYwez3FT9V4qV5U';

    // --- SETUP ---
    let db, tg, userId, userPhoto, userName;
    try { db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.error(e); }
    
    // Telegram Init
    try { 
        tg = window.Telegram?.WebApp; 
        if(tg) { 
            tg.ready(); tg.expand(); 
            // Получаем цвета из темы ТГ для мета-тега (чтобы бар сливался с фоном)
            tg.setHeaderColor(getComputedStyle(document.body).getPropertyValue('--bg-color').trim());
            
            userId = tg.initDataUnsafe?.user?.id;
            userPhoto = tg.initDataUnsafe?.user?.photo_url;
            userName = tg.initDataUnsafe?.user?.first_name || 'Пользователь';
        } 
    } catch(e) {}

    // Formatters
    const fmt = n => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';
    const fmtDate = d => {
        const date = new Date(d), now = new Date();
        const diff = (now - date) / (1000 * 60 * 60 * 24);
        if(diff < 1 && now.getDate() === date.getDate()) return `Сегодня, ${date.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}`;
        return date.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
    };
    const fmtFull = d => new Date(d).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});

    // --- LOGIC ---
    async function load() {
        if (!userId || !db) { 
            showError(); return; 
        }
        
        const [profitsRes, userRes] = await Promise.all([
            db.from('profits').select('*').eq('worker_id', userId).order('created_at', {ascending: false}),
            db.from('users').select('*').eq('id', userId).single()
        ]);
        
        document.getElementById('loader').classList.add('hidden');
        
        const data = profitsRes.data || [];
        const user = userRes.data;
        
        // 1. Fill Header
        document.getElementById('headerAvatar').innerHTML = userPhoto 
            ? `<img src="${userPhoto}">` 
            : `<div class="avatar-fallback">${userName[0]}</div>`;
        document.getElementById('headerName').textContent = user?.full_name || userName;
        
        if (!data.length) { 
            showEmpty(); return; 
        }

        // 2. Calculations
        const total = data.reduce((s,p) => s + parseFloat(p.net_profit), 0);
        const paid = data.filter(p => p.status === 'paid');
        const hold = data.filter(p => p.status === 'hold');
        const holdSum = hold.reduce((s,p) => s + parseFloat(p.net_profit), 0);
        const maxProfit = Math.max(...data.map(p => parseFloat(p.net_profit)));
        const avgProfit = total / data.length;

        // 3. Fill Stats Card
        document.getElementById('totalAmount').textContent = fmt(total);
        document.getElementById('countPaid').textContent = paid.length;
        document.getElementById('countHold').textContent = hold.length;
        document.getElementById('sumHold').textContent = fmt(holdSum);

        // 4. Fill Quick Chips
        document.getElementById('quickStats').innerHTML = `
            <div class="chip">
                <div class="chip-icon" style="background: #34c759">${ICONS.chart}</div>
                <div class="chip-val">${fmt(avgProfit)}</div>
                <div class="chip-lbl">Средний</div>
            </div>
            <div class="chip">
                <div class="chip-icon" style="background: #a855f7">${ICONS.diamond}</div>
                <div class="chip-val">${fmt(maxProfit)}</div>
                <div class="chip-lbl">Рекорд</div>
            </div>
            <div class="chip">
                <div class="chip-icon" style="background: #007aff">${ICONS.tag}</div>
                <div class="chip-val">${data.length}</div>
                <div class="chip-lbl">Всего</div>
            </div>
        `;

        // 5. Fill List
        document.getElementById('txCount').textContent = data.length;
        document.getElementById('content').innerHTML = data.map(p => {
            const isPaid = p.status === 'paid';
            return `
            <div class="tx-item" onclick='openModal(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
                <div class="tx-icon ${p.status}">
                    <div style="width:24px; height:24px">${isPaid ? ICONS.check : ICONS.clock}</div>
                </div>
                <div class="tx-body">
                    <div class="tx-title">${p.service_name}</div>
                    <div class="tx-date">${fmtDate(p.created_at)}</div>
                </div>
                <div class="tx-right">
                    <div class="tx-amount">+${fmt(p.net_profit)}</div>
                    <div class="tx-status ${p.status}">${isPaid ? 'Выплачено' : 'Холд'}</div>
                </div>
            </div>
            `;
        }).join('');
    }

    // --- MODAL ---
    function openModal(p) {
        if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        
        const pct = p.amount > 0 ? Math.round((p.net_profit / p.amount) * 100) : 0;
        document.getElementById('mAmount').textContent = `+${fmt(p.net_profit)}`;
        
        document.getElementById('modalBody').innerHTML = `
            <div class="detail-row">
                <span class="d-label">${ICONS.hash} ID транзакции</span>
                <span class="d-value">#${p.id}</span>
            </div>
            <div class="detail-row">
                <span class="d-label">${ICONS.tag} Сервис</span>
                <span class="d-value">${p.service_name}</span>
            </div>
            <div class="detail-row">
                <span class="d-label">${ICONS.wallet} Сумма чека</span>
                <span class="d-value">${fmt(p.amount)}</span>
            </div>
            <div class="detail-row">
                <span class="d-label">${ICONS.chart} Твой процент</span>
                <span class="d-value">${pct}%</span>
            </div>
            <div class="detail-row">
                <span class="d-label">${ICONS.calendar} Создан</span>
                <span class="d-value">${fmtFull(p.created_at)}</span>
            </div>
            ${p.paid_at ? `
            <div class="detail-row">
                <span class="d-label" style="color:var(--success)">${ICONS.check} Выплачен</span>
                <span class="d-value" style="color:var(--success)">${fmtFull(p.paid_at)}</span>
            </div>` : ''}
        `;
        
        document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    // Close on overlay click
    document.getElementById('modal').onclick = (e) => {
        if(e.target.id === 'modal') closeModal();
    }
    
    // Telegram Back Button logic
    if(tg?.BackButton) {
        tg.BackButton.onClick(closeModal);
    }

    // Helpers
    function showEmpty() {
        document.getElementById('statsContainer').style.display = 'none';
        document.getElementById('quickStats').style.display = 'none';
        document.getElementById('content').innerHTML = `
            <div class="empty-state">
                <div class="empty-icon"><div style="width:32px; height:32px">${ICONS.wallet}</div></div>
                <h3>История пуста</h3>
                <p style="color:var(--hint-color); margin-top:8px">Здесь появятся ваши первые профиты</p>
            </div>
        `;
    }

    function showError() {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('content').innerHTML = `
            <div class="empty-state">
                <h3>Ошибка доступа</h3>
                <p style="color:var(--hint-color)">Откройте через бота IRL Team</p>
            </div>
        `;
    }

    // Start
    load();
</script>
</body>
</html>
